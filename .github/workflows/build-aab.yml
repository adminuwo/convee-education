name: Build Android AAB (App Bundle)

on:
  workflow_dispatch:

jobs:
  build-aab:
    name: Build Android App Bundle (AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate Android Native Project via Expo Prebuild
        working-directory: mobile
        run: npx expo prebuild --platform android --clean

      - name: Build Android App Bundle (.aab)
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon || ./gradlew bundleDebug --no-daemon

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConveeEducation-AppBundle-AAB
          path: mobile/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
