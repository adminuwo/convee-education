name: Build Mobile App (Interactive)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform'
        required: true
        default: 'android'
        type: choice
        options:
          - 'android'
          - 'ios'
          - 'all'
      profile:
        description: 'Build Profile (preview = APK/Test, production = AAB/Store, development = Debug)'
        required: true
        default: 'preview'
        type: choice
        options:
          - 'preview'
          - 'production'
          - 'development'

jobs:
  build-android:
    name: Build Android (${{ inputs.profile }})
    if: inputs.platform == 'android' || inputs.platform == 'all'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK (r27+ for 16 KB Page Alignment)
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b
          link-to-sdk: true

      - name: Install NPM Dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate Android Native Project via Expo Prebuild
        working-directory: mobile
        run: |
          npx expo prebuild --platform android --clean
          # Configure build memory and New Architecture for 16 KB native compilation
          echo "newArchEnabled=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties

      - name: Compile Android Package (16 KB Page Aligned)
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          PROFILE="${{ inputs.profile }}"

          if [ "$PROFILE" = "preview" ]; then
            echo ">>> Building Standalone Release APK for Firebase / Testers (16 KB Page Aligned)..."
            ./gradlew assembleRelease --no-daemon -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON
          elif [ "$PROFILE" = "production" ]; then
            echo ">>> Building Production Release AAB for Google Play Store (16 KB Page Aligned)..."
            ./gradlew bundleRelease --no-daemon -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON
          elif [ "$PROFILE" = "development" ]; then
            echo ">>> Building Development Debug APK (16 KB Page Aligned)..."
            ./gradlew assembleDebug --no-daemon -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON
          fi

      - name: Verify 16 KB Page Alignment
        working-directory: mobile
        run: |
          echo ">>> Verifying 16 KB page alignment on generated binaries..."
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" 2>/dev/null | head -n 1)
          if [ -n "$APK_FILE" ]; then
            mkdir -p /tmp/apk_inspect
            unzip -q "$APK_FILE" -d /tmp/apk_inspect
            echo "Inspecting ELF alignment on bundled native libraries:"
            find /tmp/apk_inspect/lib -name "*.so" | head -n 5 | while read so_file; do
              echo "Checking $so_file:"
              objdump -p "$so_file" | grep -i "align" | head -n 2 || true
            done
            rm -rf /tmp/apk_inspect
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ConveeEducation-Android-${{ inputs.profile }}
          path: |
            mobile/android/app/build/outputs/apk/**/*.apk
            mobile/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

  build-ios:
    name: Build iOS (${{ inputs.profile }})
    if: inputs.platform == 'ios' || inputs.platform == 'all'
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install NPM Dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate Native iOS Project via Expo Prebuild
        working-directory: mobile
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: pod install

      - name: Compile iOS Archive
        working-directory: mobile/ios
        run: |
          PROFILE="${{ inputs.profile }}"
          if [ "$PROFILE" = "development" ]; then
            CONFIG="Debug"
          else
            CONFIG="Release"
          fi
          echo ">>> Building Xcode Archive for configuration: $CONFIG"
          xcodebuild archive \
            -workspace ConveeEducation.xcworkspace \
            -scheme ConveeEducation \
            -configuration $CONFIG \
            -archivePath build/ConveeEducation.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        working-directory: mobile/ios
        run: |
          mkdir -p Payload
          cp -r build/ConveeEducation.xcarchive/Products/Applications/ConveeEducation.app Payload/
          zip -r ConveeEducation-${{ inputs.profile }}.ipa Payload
          mkdir -p ../dist
          mv ConveeEducation-${{ inputs.profile }}.ipa ../dist/

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConveeEducation-iOS-IPA-${{ inputs.profile }}
          path: mobile/dist/ConveeEducation-${{ inputs.profile }}.ipa
          if-no-files-found: error
