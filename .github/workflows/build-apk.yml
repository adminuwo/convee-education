name: Build Android APK for Firebase

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate Android Native Project via Expo Prebuild
        working-directory: mobile
        run: npx expo prebuild --platform android --clean

      - name: Build Standalone Test APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact for Firebase
        uses: actions/upload-artifact@v4
        with:
          name: ConveeEducation-Firebase-Test-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
