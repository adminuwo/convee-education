name: Build Flutter Mobile App (16 KB Page Aligned)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build Target'
        required: true
        default: 'apk'
        type: choice
        options:
          - 'apk'
          - 'appbundle'

jobs:
  build:
    name: Build Flutter (${{ inputs.target }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Runner Disk Space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk/2* 2>/dev/null || true
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Flutter 3.24+ (Official 16 KB Page Support)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK r27b (16 KB Page Support)
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b
          link-to-sdk: true

      - name: Configure Flutter Native Platform (v2 Embedding)
        working-directory: mobile-flutter
        run: |
          flutter create . --org com.convee.education --project-name convee_education --platforms android
          flutter pub get

      - name: Build Android Package
        working-directory: mobile-flutter
        run: |
          TARGET="${{ inputs.target }}"
          if [ "$TARGET" = "appbundle" ]; then
            echo ">>> Building Production Release AAB (Flutter 16 KB Aligned)..."
            flutter build appbundle --release
          else
            echo ">>> Building Standalone Release APK (Flutter 16 KB Aligned)..."
            flutter build apk --release
          fi

      - name: Verify 16 KB Page Alignment
        working-directory: mobile-flutter
        run: |
          echo ">>> Verifying 16 KB page alignment on generated Flutter APK..."
          APK_FILE=$(find build/app/outputs/flutter-apk -name "*.apk" 2>/dev/null | head -n 1)
          if [ -n "$APK_FILE" ]; then
            mkdir -p /tmp/apk_inspect
            unzip -q "$APK_FILE" -d /tmp/apk_inspect
            echo "Inspecting ELF alignment on bundled native libraries:"
            find /tmp/apk_inspect/lib -name "*.so" | head -n 10 | while read so_file; do
              echo "Checking $so_file:"
              objdump -p "$so_file" | grep -i "align" | head -n 2 || true
            done
            rm -rf /tmp/apk_inspect
          fi

      - name: Upload Flutter Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ConveeEducation-Flutter-${{ inputs.target }}
          path: |
            mobile-flutter/build/app/outputs/flutter-apk/**/*.apk
            mobile-flutter/build/app/outputs/bundle/**/*.aab
          if-no-files-found: error
