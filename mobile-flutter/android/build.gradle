allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

val rootProjectBuildDir = rootProject.layout.buildDirectory.asFile.get()
subprojects {
    project.layout.buildDirectory.set(File(rootProjectBuildDir, project.name))
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete(rootProject.layout.buildDirectory)
}
